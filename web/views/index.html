<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GapAudit</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 3rem 2rem; min-height: 100vh; box-sizing: border-box;
    background: #14161a; color: #e8eaed;
    font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 .75rem; }
  p  { margin: .35rem 0; color: #a9b0ba; }
  code { background: #22262d; padding: .1rem .35rem; border-radius: 4px; color: #d6dae0; }
  .card { background: #1b1f25; border: 1px solid #2b3138; border-radius: 10px;
          padding: 1.75rem 2rem; max-width: 640px; width: 100%; text-align: center; }
  #health { margin-top: 1rem; font-family: Consolas, monospace; font-size: .9rem; }
  .ok { color: #6fcf97; } .bad { color: #eb5757; }
  .hint { margin-top: 1.5rem; font-size: .82rem; color: #767f8b; }
</style>
</head>
<body>
  <div class="card">
    <h1>GapAudit — каркас работает</h1>
    <p>Версия приложения: <code>{{ version }}</code></p>
    <p>Связка pywebview + FastAPI + uvicorn поднялась, токен-миддлварь пропустил запрос.</p>
    <div id="health"><span class="hint">проверяю /api/health…</span></div>
    <p class="hint">Это единственный экран шага 0.1. Метод, БД и рабочие экраны — следующие шаги плана.</p>
  </div>

<script>
// Токен приходит в query-параметре от desktop.py; дальше он же уходит заголовком,
// чтобы проверить, что миддлварь действительно работает, а не просто «страница есть».
const token = new URLSearchParams(location.search).get('token') || '';
const box = document.getElementById('health');
fetch('/api/health', { headers: token ? { 'X-GapAudit-Token': token } : {} })
  .then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      box.className = 'bad';
      box.textContent = '/api/health → ' + r.status + ' ' + (body.detail || '');
      return;
    }
    box.className = 'ok';
    box.textContent = '/api/health → ok=' + body.ok + ', version=' + body.version;
  })
  .catch((e) => {
    box.className = 'bad';
    box.textContent = '/api/health недоступен: ' + e;
  });
</script>
</body>
</html>
