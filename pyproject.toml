[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapaudit"
version = "0.2.0"
description = "GapAudit — локальное приложение поверх скилла ecosystem-gap-audit (каркас)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "GapAudit" }]
keywords = ["gap-audit", "ecosystem", "mcp", "research"]
dependencies = [
    # Границы — по major/minor: патчи не фиксируем, ломающих скачков не допускаем.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "pywebview>=6.0,<7",
    # pythonnet — только Windows (мост к WebView2/.NET). На Linux его нет и
    # собрать нечем, поэтому маркер: без него CI (ubuntu-latest) не поставит
    # зависимости вообще (шаг P4d).
    "pythonnet>=3.0,<4; sys_platform == 'win32'",
    # httpx нужен и приложению (ожидание /api/health в desktop.py), не только тестам.
    # Верхняя граница <0.29: starlette 1.9 готовится к httpx2, 0.29+ ещё не проверяли.
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "mypy>=1.8,<2",
]
# Сборка .exe (шаг P4d): отдельный extra, чтобы PyInstaller не попадал в
# рабочее окружение по умолчанию — он нужен только `uv pip install -e ".[packaging]"`.
packaging = [
    "pyinstaller>=6.10,<7",
]

[tool.setuptools]
# Список явный, а не packages.find: каждый пакет называется руками.
# core.collectors добавлен в P4c (AGENTS gotcha 59) — без этого PyInstaller
# onedir (P4d) не собрал бы коллекторы, а тесты этого не поймают: они
# запускаются из исходников.
packages = ["core", "core.collectors", "cli", "app", "web", "tools"]
py-modules = ["desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: тяжёлые проверки (реальный L1/L2 compat_check, тесты с реальными подпроцессами) — быстрый цикл: -m \"not slow\" (цель: см. DEVPLAN §11, P-phase caps)",
]
